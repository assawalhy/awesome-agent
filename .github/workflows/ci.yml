name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax-check installer
        run: bash -n install.sh
      - name: Run tests
        run: python3 tests/test_awesome_agent.py
